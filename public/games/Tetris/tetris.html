<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Classic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 14px 10px;
        }

        .header-bar {
            width: 100%;
            max-width: 280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-back {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-pause {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-pause:active {
            transform: scale(0.95);
        }

        .scoreboard {
            font-size: 0.95rem;
            font-weight: 700;
            color: #38bdf8;
        }

        #tetrisCanvas {
            background-color: #111827;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        /* Kontrol Khusus Layar HP */
        .controls {
            margin-top: 14px;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .ctrl-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 12px;
            font-size: 1.4rem;
            height: 52px;
            min-width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 0 #1e293b;
        }

        .ctrl-btn.rotate {
            background: #0284c7;
            flex: 1;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .ctrl-btn.drop {
            background: #10b981;
            flex: 1;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="../../index.html" class="btn-back">⬅ Menu</a>
        <button class="btn-pause" id="btnPause">⏸ Pause</button>
        <div class="scoreboard">Skor: <span id="score">0</span></div>
    </div>

    <!-- Canvas Grid 10 x 20 -->
    <canvas id="tetrisCanvas" width="200" height="400"></canvas>

    <div class="controls">
        <div class="btn-row">
            <button class="ctrl-btn rotate" id="btnRotate">Putar ↻</button>
            <button class="ctrl-btn drop" id="btnDrop">Jatuh ⤓</button>
        </div>
        <div class="btn-row">
            <button class="ctrl-btn" id="btnLeft">◀</button>
            <button class="ctrl-btn" id="btnDown">▼</button>
            <button class="ctrl-btn" id="btnRight">▶</button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
