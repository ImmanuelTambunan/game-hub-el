<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎮 Mini Arcade</h1>
        <p>Koleksi Game Web Klasik</p>
    </header>

    <main class="game-container">

        <!-- KARTU 1: SNAKE (Yang ini yang punya link ke snake.html) -->
        <div class="game-card">
            <div class="game-icon">🐍</div>
            <h2>Snake Classic</h2>
            <p>Makan apel dan jangan tabrak dinding!</p>
            <a href="snake.html" class="btn-play">Main Sekarang</a>
        </div>

        <!-- KARTU 2: TETRIS (Masih ditutup / disabled dulu) -->
        <div class="game-card">
            <div class="game-icon">🧱</div>
            <h2>Tetris</h2>
            <p>Susun balok dan pecahkan rekor.</p>
            <button class="btn-play" disabled>Segera Hadir</button>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
